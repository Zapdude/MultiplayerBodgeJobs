name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 1.7

# Serialize rebuilds of the same branch. version.json names the release; bumping it
# mints a new tag, and until then every push refreshes the same one.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 1.6 builds the base assembly from NuGet references and packages the committed assemblies.
  # The Referenced assembly needs third-party mod DLLs that must not be redistributed, so it is
  # built locally and shipped as committed.
  release-1-6:
    name: Release 1.6
    if: github.ref_name == 'main'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      MOD_DIR: dist/MultiplayerBodgeJobs
      ASSET: MultiplayerBodgeJobs-1.6.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply version
        id: version
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File ./build/apply-version.ps1 --hash
          if ($LASTEXITCODE -ne 0) { throw 'apply-version failed' }
          $out
          foreach ($line in $out) {
            if ($line -match '^(version|releaseTag|prerelease)=') {
              [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", [System.Text.UTF8Encoding]::new($false))
            }
          }

      - name: Build compat assembly
        run: dotnet build Source/Multiplayer_Compat.csproj -c Release

      - name: Verify committed assemblies
        shell: powershell
        run: |
          foreach ($file in 'Assemblies/Multiplayer_Compat.dll', 'Referenced/Multiplayer_Compat_Referenced.dll') {
            if (-not (Test-Path $file)) { throw "Missing committed assembly: $file" }
          }
          $drift = git status --porcelain -- Assemblies Referenced
          if ($drift) {
            Write-Warning 'The build output differs from the committed assemblies:'
            $drift | ForEach-Object { Write-Warning $_ }
            Write-Warning 'Commit the rebuilt assemblies on main so the release matches source.'
          }

      - name: Stage mod folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:MOD_DIR/Assemblies", "$env:MOD_DIR/Referenced" | Out-Null
          Copy-Item About, Languages, LICENSE, NOTICE.md, PATCHES.md, README.md -Destination $env:MOD_DIR -Recurse
          Copy-Item Assemblies/*.dll -Destination "$env:MOD_DIR/Assemblies"
          Copy-Item Referenced/*.dll -Destination "$env:MOD_DIR/Referenced"

      - name: Package
        shell: powershell
        run: Compress-Archive -Path $env:MOD_DIR -DestinationPath $env:ASSET -Force

      - name: Publish release
        shell: powershell
        env:
          RELEASE_TAG: ${{ steps.version.outputs.releaseTag }}
          RELEASE_TITLE: Multiplayer Bodge Jobs ${{ steps.version.outputs.version }} (1.6)
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $notes = @'
          Multiplayer Bodge Jobs ${{ steps.version.outputs.version }} for RimWorld 1.6, from the head of `main`.

          This release is rebuilt on every push to `main` until the version in `version.json` is bumped; the version number names the release line, and `About/About.xml` records the commit each build was made from.

          Requires Multiplayer Bodged (`zap.multiplayerbodged`). Do not enable the original Multiplayer Compatibility alongside this mod.

          Contains the base compat assembly and the Referenced assembly (VEF, VFE Empire, VFE Classical, VFE Deserters, VGE, Altered Carbon, Hemogen Extractor).
          '@
          # Windows PowerShell turns a native command's stderr into an error record, and the
          # actions wrapper stops on those, so the existence check runs through cmd.
          cmd /c "gh release view $env:RELEASE_TAG >nul 2>nul"
          if ($LASTEXITCODE -eq 0) { gh release delete --cleanup-tag --yes $env:RELEASE_TAG }
          $ghArgs = @($env:RELEASE_TAG, '--target', '${{ github.sha }}', '--title', $env:RELEASE_TITLE, '--notes', $notes)
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
          gh release upload $env:RELEASE_TAG $env:ASSET --clobber
          if ($env:PRERELEASE -ne 'true') { gh release edit $env:RELEASE_TAG --latest }

  # 1.7 needs installed workshop mods and the game's UnityEngine.CoreModule.dll, which CI cannot
  # obtain without redistributing them or logging into Steam. It builds on a self-hosted runner
  # instead, so nothing third-party enters the repo and the release is a real build of the branch.
  release-1-7:
    name: Release 1.7
    # Manual dispatch only, by the repository owner. The runner is ephemeral and registered with
    # the bodgejobs-1.7 label, so it can only take this job and it unregisters itself afterwards.
    # triggering_actor is checked as well so a re-run by another account cannot reuse this job.
    if: github.ref_name == '1.7' && github.event_name == 'workflow_dispatch' && github.actor == 'Zapdude' && github.triggering_actor == 'Zapdude'
    runs-on: [self-hosted, Windows, bodgejobs-1.7]
    env:
      GH_TOKEN: ${{ github.token }}
      MOD_DIR: dist/MultiplayerBodgeJobs
      ASSET: MultiplayerBodgeJobs-1.7.zip
    steps:
      - uses: actions/checkout@v4

      - name: Apply version
        id: version
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File ./build/apply-version.ps1 --hash
          if ($LASTEXITCODE -ne 0) { throw 'apply-version failed' }
          $out
          foreach ($line in $out) {
            if ($line -match '^(version|releaseTag|prerelease)=') {
              [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$line`n", [System.Text.UTF8Encoding]::new($false))
            }
          }

      - name: Build all assemblies
        run: |
          dotnet build Source/Multiplayer_Compat.csproj -c Release
          dotnet build Source_Referenced/Multiplayer_Compat_Referenced.csproj -c Release
          dotnet build Source_Gravship2/Multiplayer_Gravship2Overrides.csproj -c Release

      - name: Verify committed assemblies
        shell: powershell
        run: |
          foreach ($file in 'Assemblies/Multiplayer_Compat.dll', 'Referenced/Multiplayer_Compat_Referenced.dll', 'Referenced/Multiplayer_Gravship2Overrides.dll') {
            if (-not (Test-Path $file)) { throw "Missing assembly: $file" }
          }
          $drift = git status --porcelain -- Assemblies Referenced
          if ($drift) {
            Write-Warning 'The build output differs from the committed assemblies:'
            $drift | ForEach-Object { Write-Warning $_ }
            Write-Warning 'Commit the rebuilt assemblies on 1.7 so the release matches source.'
          }

      - name: Stage mod folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:MOD_DIR/Assemblies", "$env:MOD_DIR/Referenced" | Out-Null
          Copy-Item About, LICENSE, NOTICE.md, PATCHES.md, README.md -Destination $env:MOD_DIR -Recurse
          Copy-Item Assemblies/*.dll -Destination "$env:MOD_DIR/Assemblies"
          Copy-Item Referenced/*.dll -Destination "$env:MOD_DIR/Referenced"

      - name: Package
        shell: powershell
        run: Compress-Archive -Path $env:MOD_DIR -DestinationPath $env:ASSET -Force

      - name: Publish release
        shell: powershell
        env:
          RELEASE_TAG: ${{ steps.version.outputs.releaseTag }}
          RELEASE_TITLE: Multiplayer Bodge Jobs ${{ steps.version.outputs.version }} (1.7)
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          $notes = @'
          Multiplayer Bodge Jobs ${{ steps.version.outputs.version }} for RimWorld 1.7, from the head of the `1.7` branch. Experimental: RimWorld 1.7 and the modules behind it are still moving.

          This release is rebuilt on every dispatch until the version in `version.json` is bumped; the version number names the release line, and `About/About.xml` records the commit each build was made from.

          Requires Multiplayer Bodged (`zap.multiplayerbodged`). Do not enable the original Multiplayer Compatibility alongside this mod.

          Contains the base compat assembly, the Referenced assembly (VEF, VFE Empire, VGE) and the VGE Chapter 2 body module.
          '@
          # Windows PowerShell turns a native command's stderr into an error record, and the
          # actions wrapper stops on those, so the existence check runs through cmd.
          cmd /c "gh release view $env:RELEASE_TAG >nul 2>nul"
          if ($LASTEXITCODE -eq 0) { gh release delete --cleanup-tag --yes $env:RELEASE_TAG }
          $ghArgs = @($env:RELEASE_TAG, '--target', '${{ github.sha }}', '--title', $env:RELEASE_TITLE, '--notes', $notes)
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
          gh release upload $env:RELEASE_TAG $env:ASSET --clobber
          if ($env:PRERELEASE -ne 'true') { gh release edit $env:RELEASE_TAG --latest }
